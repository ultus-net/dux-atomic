name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build as sha-<commit>
        type: boolean
        default: false
      promote:
        description: Move latest to this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A PR run may be cancelled. A main run may be publishing, so never cancel it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ultus-net/dux-atomic

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and static checks
        run: tests/lint.sh

  # Proves the signature policy mechanism with a fixture key on a throwaway
  # registry. No image artifact and no OIDC identity: the shipped keyless policy
  # stays deferred, see docs/known-gaps.md.
  signing:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install podman and skopeo
        run: build/install-packages.sh podman skopeo

      # Key-based signing needs the legacy .sig attachment format. containers/image
      # cannot read the cosign v3 bundle format yet (container-libs#388), so this
      # stays on the version publish pins.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Signature acceptance and rejection
        run: tests/test-signing.sh

  # Read-only: this job runs repository scripts from the PR head, so it holds no
  # write token and no OIDC identity.
  image:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs PR code; leave no token in the checkout's git config.
          persist-credentials: false

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          # v2 leaves swap in place because removing it can kill a job under
          # memory pressure. The image and qcow2 builds need the disk, so this
          # pins the v1 behaviour deliberately.
          swap-storage: true

      - name: Install podman and qemu
        run: build/install-packages.sh podman qemu-system-x86 qemu-utils ovmf

      - name: Build image
        run: podman build --layers -t localhost/dux-atomic:ci .

      - name: Image lint and unit verify
        run: tests/verify-image.sh localhost/dux-atomic:ci

      - name: Export image
        run: |
          mkdir -p .cache
          podman save localhost/dux-atomic:ci -o .cache/image.tar

      - name: SBOM
        # A digest-pinned syft scans a flattened rootfs and writes the report
        # to a file. Scanning the docker archive needed more than 8 GB here,
        # and the former action buffered the report in memory until the Node
        # heap died, which left the step with no error line.
        run: |
          set -o pipefail
          podman create --name sbom-rootfs localhost/dux-atomic:ci
          mkdir -p "$RUNNER_TEMP/rootfs"
          podman export sbom-rootfs | tar -x -C "$RUNNER_TEMP/rootfs"
          podman rm sbom-rootfs
          podman run --rm -v "$RUNNER_TEMP/rootfs:/rootfs:ro" \
            ghcr.io/anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36 \
            scan dir:/rootfs \
            --source-name dux-atomic --source-version "$GITHUB_SHA" \
            -o spdx-json > "$RUNNER_TEMP/syft-full.spdx.json"
          # Rekor's public instance answered 502 for the 86 MB attestation body
          # in run 42810574149, so the attested document keeps packages only.
          # The same run's SBOM was 64181348 bytes and is 6508304 after this.
          jq -c -f build/sbom-packages-only.jq \
            "$RUNNER_TEMP/syft-full.spdx.json" > dux-atomic.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dux-atomic.spdx.json
          retention-days: 14

      - name: Build disk
        run: |
          sudo podman load -i .cache/image.tar
          sudo tests/vm/make-disk.sh localhost/dux-atomic:ci "$GITHUB_WORKSPACE/output"

      - name: Boot smoke test
        # Hosted runners have no /dev/kvm and no host GPU, so this is TCG and
        # headless. It asserts the greeter session and the first-login units,
        # not rendered pixels. The graphical dogfood stays a local step.
        env:
          # A hosted runner is TCG with no /dev/kvm, measured at roughly 4.6x
          # wall-clock slowdown: run 43068532421 needed 21 minutes to reach the
          # login prompt. 1800s leaves room for a slower runner, and the image
          # job's timeout-minutes: 180 still bounds the whole build.
          BOOT_TIMEOUT: '1800'
          BOOT_GRACE: '300'
          QEMU_ACCEL: tcg
        run: |
          tests/vm/boot-smoke.sh \
            "$GITHUB_WORKSPACE/output/qcow2/disk.qcow2" \
            "$GITHUB_WORKSPACE/.vm/boot.log"

      - name: Vulnerability scan
        # Blocking: .trivyignore holds the triaged duxlabs Go-binary findings
        # and every entry expires, so a stale ignore reds the scan (#3).
        # A pinned container avoids the action's unpinned setup-trivy dependency.
        run: |
          podman run --rm -v "$PWD:/src:ro" -w /src \
            docker.io/aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image --input .cache/image.tar --severity CRITICAL,HIGH \
            --ignore-unfixed --ignorefile .trivyignore --exit-code 1 \
            --cache-dir /tmp/trivy --format table > trivy-report.txt

      - name: Upload scan report
        # Keep the report when the scan is red; it is the failure evidence.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 14

      - name: Upload boot evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-evidence
          path: |
            .vm/boot.log
            .vm/qemu.err
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload image artifact
        # Only the publish path needs the tar; a PR run does not.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: .cache/image.tar
          retention-days: 3
          compression-level: 0

  # The only job with write token and OIDC identity. It checks out the repository
  # for the shared package installer and never builds image content: it loads the
  # artifact built above and pushes it. Run 43082564852 failed this job with exit
  # 127 because the install step ran with no checkout present (#52).
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish || inputs.promote)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ghcr
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The write token is not left in the workspace: the install step needs the
      # repository only to run the shared package helper (#52).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: .cache

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Install podman and skopeo
        run: build/install-packages.sh podman skopeo

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the commit tag
        id: push
        env:
          SHA_TAG: sha-${{ github.sha }}
        run: |
          podman load -i .cache/image.tar
          podman tag localhost/dux-atomic:ci "$IMAGE:$SHA_TAG"
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$SHA_TAG"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

      - name: Record the pushed digest
        # Before any network action after the push, as a check-run annotation.
        # A job that times out keeps no log, and this line is the only record
        # the digest gets.
        run: |
          digest=$(cat "$RUNNER_TEMP/digest")
          echo "::notice::pushed $IMAGE@$digest"

      - name: Write the publish helpers
        # A step's own timeout did not stop a hanging command: run 42933898962
        # was cancelled by the job's 60-minute cap without firing the step's
        # 40-minute bound, and run 42943634705 was still running 51 minutes in.
        # Neither kept a log. One command per step names the hang, so the
        # helpers move to a file each signing step sources.
        # The heredoc is quoted, so `$@` and `$SECONDS` reach the file intact.
        run: |
          cat >"$RUNNER_TEMP/helpers.sh" <<'HELPERS'
          with_log() {
            local file=$1 status=0
            shift
            : >"$file"
            "$@" >>"$file" 2>&1 || status=$?
            # One 8.7 MB line from `cosign verify-attestation` stalled the runner's
            # log pipeline (actions/runner#1031), and no step timeout ended it. Print
            # a bounded prefix and report what was dropped.
            local bytes
            bytes=$(wc -c <"$file")
            timeout 10 head -c 20000 "$file" || true
            if ((bytes > 20000)); then
              echo "[with_log: printed 20000 of ${bytes} bytes from ${file##*/}]"
            fi
            return "$status"
          }
          retry() {
            if (($# == 0)); then
              echo "retry: no command given" >&2
              return 2
            fi
            local attempt=1 pause=30 max=5 budget=600 started=$SECONDS
            local deadline=$((started + budget)) remaining cap
            while :; do
              remaining=$((deadline - SECONDS))
              ((remaining > 0)) || break
              cap=$((remaining < 300 ? remaining : 300))
              timeout --kill-after=10 "$cap" "$@" && return 0
              ((attempt >= max)) && break
              remaining=$((deadline - SECONDS))
              ((remaining > pause)) || break
              echo "::warning::attempt ${attempt} failed; retrying in ${pause}s: $*"
              attempt=$((attempt + 1))
              sleep "$pause"
              pause=$((pause * 2))
            done
            echo "failed after ${attempt} attempts in $((SECONDS - started))s: $*" >&2
            return 1
          }
          HELPERS
          # Fail here, not inside a signing step, if the body was cut short.
          bash -n "$RUNNER_TEMP/helpers.sh"
          source "$RUNNER_TEMP/helpers.sh"
          declare -F with_log >/dev/null
          declare -F retry >/dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Sign the digest
        # Each attempt is capped and each command has a wall-clock budget, so
        # the step is bounded even when every call hangs. The fast-failure path
        # reaches five attempts; a command whose attempts each hang exhausts
        # the budget in two.
        timeout-minutes: 15
        run: |
          source "$RUNNER_TEMP/helpers.sh"
          digest=$(cat "$RUNNER_TEMP/digest")
          with_log "$RUNNER_TEMP/sign.log" retry cosign sign --yes "$IMAGE@$digest"

      - name: Attest the SBOM
        # Rekor's public instance answered 502 for this image's attestation
        # body at about 86 MB, which the SBOM step now prevents by stripping
        # the file inventory. The retry stays for genuine 5xx and network
        # failures, and cosign gives up after its own four attempts.
        timeout-minutes: 15
        run: |
          source "$RUNNER_TEMP/helpers.sh"
          digest=$(cat "$RUNNER_TEMP/digest")
          with_log "$RUNNER_TEMP/attest.log" retry cosign attest --yes --predicate sbom/dux-atomic.spdx.json --type spdxjson "$IMAGE@$digest"

      - name: Attest build provenance
        # The SBOM attestation says what is inside the image, not who built it.
        # This binds the pushed digest to this workflow run, so a verifier can
        # tell the image came from ci.yml on main and not from a rebuild
        # elsewhere. Storage records stay off, which keeps
        # `artifact-metadata: write` out of this job.
        timeout-minutes: 10
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Upload publish logs
        # A step that times out keeps no log, so the files upload whatever the
        # outcome. A missing file is not a failure: a step can die before it
        # writes one.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  # Keyless verification reads the registry and the transparency log. It runs in
  # its own job because a stall here survived both a command timeout and a step
  # timeout: run 42961488922 signed in 4s and attested in 5s, then held
  # "Verify the signature and attestation" from 05:32:56 to the job's 60-minute
  # cap with no log. A job boundary is the only bound that ends it, and the
  # publish job stays green so the queue drains.
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Verify the signature
        # cosign prints the payload on stdout; a failed check prints on stderr.
        # The attested SBOM is about 8.7 MB on one line, and the runner's log
        # pipeline stalled on it, so stdout goes to a file and only a prefix is
        # printed. The job bound remains the backstop.
        timeout-minutes: 8
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          status=0
          timeout --kill-after=10 180 cosign verify \
            --certificate-identity "https://github.com/ultus-net/dux-atomic/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >"$RUNNER_TEMP/verify.log" || status=$?
          timeout 10 head -c 20000 "$RUNNER_TEMP/verify.log" || true
          exit "$status"

      - name: Verify the attestation
        # cosign prints the attestation on stdout; a failed check prints on stderr.
        # The attested SBOM is about 8.7 MB on one line, and the runner's log
        # pipeline stalled on it, so stdout goes to a file and only a prefix is
        # printed. The job bound remains the backstop.
        timeout-minutes: 8
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          status=0
          timeout --kill-after=10 180 cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "https://github.com/ultus-net/dux-atomic/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST" >"$RUNNER_TEMP/verify-attestation.log" || status=$?
          timeout 10 head -c 20000 "$RUNNER_TEMP/verify-attestation.log" || true
          exit "$status"

      - name: Verify the provenance
        # Provenance is read from the registry copy of a public package, so
        # verification does not depend on the attestations API. The identity is
        # the one the signature steps pin, so another workflow, repository or
        # branch cannot satisfy it. `gh` ships with the ubuntu-24.04 image.
        timeout-minutes: 8
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          timeout --kill-after=10 180 gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo ultus-net/dux-atomic \
            --bundle-from-oci \
            --cert-identity "https://github.com/ultus-net/dux-atomic/.github/workflows/ci.yml@refs/heads/main" \
            >"$RUNNER_TEMP/verify-provenance.log" 2>&1 || status=$?
          timeout 10 head -c 20000 "$RUNNER_TEMP/verify-provenance.log" || true
          exit "$status"

      - name: Upload verify logs
        # A capped job drops the artifact step, but a step that finishes keeps
        # its logs, and the bounded print above means the job can finish.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  # Promotion stays behind verification, so a tag moves only to a digest whose
  # signature and attestation both verified.
  promote:
    needs: [publish, verify]
    if: inputs.promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ghcr
    permissions:
      contents: read
      packages: write
    steps:
      # Run 43082564852 never reached this job; the same missing checkout failed
      # publish first. Promotion installs through the shared helper too (#52).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install skopeo
        run: build/install-packages.sh skopeo

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote latest
        # Copy the signed manifest to the tag, so the tag moves only to that
        # digest. A failed copy leaves the previous tag and fails the run.
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          skopeo copy --preserve-digests "docker://$IMAGE@$DIGEST" "docker://$IMAGE:latest"
          live=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")
          if [[ $live != "$DIGEST" ]]; then
            echo "latest resolves to $live, expected $DIGEST" >&2
            exit 1
          fi
