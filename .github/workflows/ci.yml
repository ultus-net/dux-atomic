name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build as sha-<commit>
        type: boolean
        default: false
      promote:
        description: Move latest to this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A PR run may be cancelled. A main run may be publishing, so never cancel it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ultus-net/dux-atomic

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and static checks
        run: tests/lint.sh

  # Read-only: this job runs repository scripts from the PR head, so it holds no
  # write token and no OIDC identity.
  image:
    runs-on: ubuntu-24.04
    needs: static
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs PR code; leave no token in the checkout's git config.
          persist-credentials: false

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          android: true
          dotnet: true
          haskell: true
          # v2 leaves swap in place because removing it can kill a job under
          # memory pressure. The image and qcow2 builds need the disk, so this
          # pins the v1 behaviour deliberately.
          swap-storage: true

      - name: Install podman and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86 qemu-utils ovmf

      - name: Build image
        run: podman build --layers -t localhost/dux-atomic:ci .

      - name: Image lint and unit verify
        run: tests/verify-image.sh localhost/dux-atomic:ci

      - name: Export image
        run: |
          mkdir -p .cache
          podman save localhost/dux-atomic:ci -o .cache/image.tar

      - name: SBOM
        # A digest-pinned syft scans a flattened rootfs and writes the report
        # to a file. Scanning the docker archive needed more than 8 GB here,
        # and the former action buffered the report in memory until the Node
        # heap died, which left the step with no error line.
        run: |
          set -o pipefail
          podman create --name sbom-rootfs localhost/dux-atomic:ci
          mkdir -p "$RUNNER_TEMP/rootfs"
          podman export sbom-rootfs | tar -x -C "$RUNNER_TEMP/rootfs"
          podman rm sbom-rootfs
          podman run --rm -v "$RUNNER_TEMP/rootfs:/rootfs:ro" \
            ghcr.io/anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36 \
            scan dir:/rootfs \
            --source-name dux-atomic --source-version "$GITHUB_SHA" \
            -o spdx-json > "$RUNNER_TEMP/syft-full.spdx.json"
          # Rekor's public instance answered 502 for the 86 MB attestation body
          # in run 42810574149, so the attested document keeps packages only.
          # The same run's SBOM was 64181348 bytes and is 6508304 after this.
          jq -c -f build/sbom-packages-only.jq \
            "$RUNNER_TEMP/syft-full.spdx.json" > dux-atomic.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dux-atomic.spdx.json
          retention-days: 14

      - name: Build disk
        run: |
          sudo podman load -i .cache/image.tar
          sudo tests/vm/make-disk.sh localhost/dux-atomic:ci "$GITHUB_WORKSPACE/output"

      - name: Boot smoke test
        # Hosted runners have no /dev/kvm and no host GPU, so this is TCG and
        # headless. It asserts the greeter session and the first-login units,
        # not rendered pixels. The graphical dogfood stays a local step.
        env:
          BOOT_TIMEOUT: '900'
          BOOT_GRACE: '300'
          QEMU_ACCEL: tcg
        run: |
          tests/vm/boot-smoke.sh \
            "$GITHUB_WORKSPACE/output/qcow2/disk.qcow2" \
            "$GITHUB_WORKSPACE/.vm/boot.log"

      - name: Vulnerability scan
        # Report only until the Fedora base findings are triaged (#3).
        # A pinned container avoids the action's unpinned setup-trivy dependency.
        run: |
          podman run --rm -v "$PWD:/src:ro" -w /src \
            docker.io/aquasec/trivy:0.76.2@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image --input .cache/image.tar --severity CRITICAL,HIGH \
            --ignore-unfixed --cache-dir /tmp/trivy --format table > trivy-report.txt

      - name: Upload scan report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 14

      - name: Upload boot evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-evidence
          path: |
            .vm/boot.log
            .vm/qemu.err
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload image artifact
        # Only the publish path needs the tar; a PR run does not.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: .cache/image.tar
          retention-days: 3
          compression-level: 0

  # The only job with write token and OIDC identity. It runs no repository code:
  # it loads the artifact built above and runs the workflow's own commands.
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish || inputs.promote)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ghcr
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: .cache

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Install podman and skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the commit tag
        env:
          SHA_TAG: sha-${{ github.sha }}
        run: |
          podman load -i .cache/image.tar
          podman tag localhost/dux-atomic:ci "$IMAGE:$SHA_TAG"
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$SHA_TAG"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5

      - name: Sign the digest and attest the SBOM
        run: |
          digest=$(cat "$RUNNER_TEMP/digest")
          # Record the digest before anything can stall, as a check-run
          # annotation. A job that times out keeps no log, and the annotation
          # is what survives to say which digest was pushed.
          echo "::notice::pushed $IMAGE@$digest"
          # Rekor's public instance answered 502 for this image's attestation
          # body at about 86 MB, which the SBOM step now prevents by stripping
          # the file inventory. The retry stays for genuine 5xx and network
          # failures, and cosign gives up after its own four attempts. Each
          # command retries on its own, so a failed attestation does not sign
          # the digest twice.
          #
          # Run 42827200322 stalled in this step for 51 minutes, hit the
          # 60-minute job timeout, and lost its log, so nothing could say
          # which call hung. Each attempt is capped and each command has a
          # wall-clock budget, so the step is bounded even when every call
          # hangs. The fast-failure path reaches five attempts; a command whose
          # attempts each hang exhausts the budget in two.
          #
          # Run 42917390106 then held this step open for 34 minutes, past the
          # 26 the caps allow, so a descendant outlives the kill and keeps the
          # step's stdout pipe open. Each command now writes to a file that no
          # descendant shares with the runner, and the file is printed after.
          with_log() {
            local file=$1 status=0
            shift
            : >"$file"
            "$@" >>"$file" 2>&1 || status=$?
            cat "$file"
            return "$status"
          }
          retry() {
            if (($# == 0)); then
              echo "retry: no command given" >&2
              return 2
            fi
            local attempt=1 pause=30 max=5 budget=600 started=$SECONDS
            local deadline=$((started + budget)) remaining cap
            while :; do
              remaining=$((deadline - SECONDS))
              ((remaining > 0)) || break
              cap=$((remaining < 300 ? remaining : 300))
              timeout --kill-after=10 "$cap" "$@" && return 0
              ((attempt >= max)) && break
              remaining=$((deadline - SECONDS))
              ((remaining > pause)) || break
              echo "::warning::attempt ${attempt} failed; retrying in ${pause}s: $*"
              attempt=$((attempt + 1))
              sleep "$pause"
              pause=$((pause * 2))
            done
            echo "failed after ${attempt} attempts in $((SECONDS - started))s: $*" >&2
            return 1
          }
          with_log "$RUNNER_TEMP/sign.log" retry cosign sign --yes "$IMAGE@$digest"
          with_log "$RUNNER_TEMP/attest.log" retry cosign attest --yes --predicate sbom/dux-atomic.spdx.json --type spdxjson "$IMAGE@$digest"
          # Verification is single-shot, but it reads the same network path as
          # the signing above, so it gets the same cap.
          with_log "$RUNNER_TEMP/verify.log" timeout --kill-after=10 180 cosign verify \
            --certificate-identity "https://github.com/ultus-net/dux-atomic/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$digest"
          with_log "$RUNNER_TEMP/verify-attestation.log" timeout --kill-after=10 180 cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "https://github.com/ultus-net/dux-atomic/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$digest"

      - name: Promote latest
        if: inputs.promote
        # Copy the signed manifest to the tag, so the tag moves only to that
        # digest. A failed copy leaves the previous tag and fails the run.
        run: |
          digest=$(cat "$RUNNER_TEMP/digest")
          skopeo copy --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:latest"
          live=$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest")
          if [[ $live != "$digest" ]]; then
            echo "latest resolves to $live, expected $digest" >&2
            exit 1
          fi
