# see `man dnf.conf` for defaults and possible options

[main]
# Ship the non-interactive defaults the linutil Configure DNF entry sets (#111).
# The pinned base carries no keys here, so dnf5 runs at its own defaults.
max_parallel_downloads=10
fastestmirror=True
defaultyes=True
# Written out rather than inherited: this file replaces the base's wholesale.
gpgcheck=True
