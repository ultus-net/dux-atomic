# niri ships the same file in /usr/share/xdg-desktop-portal, and
# xdg-desktop-portal reads /etc/xdg-desktop-portal first. This copy adds
# FileChooser=gtk, because xdg-desktop-portal-gnome hands file pickers to
# nautilus from version 47.0 and this image ships no nautilus. Screen sharing
# still comes from the gnome portal, which niri needs for screencasting.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
