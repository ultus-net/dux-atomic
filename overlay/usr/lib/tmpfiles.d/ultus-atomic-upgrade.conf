# An upgrade preserves /etc, so what the earlier image identity wrote there
# outlives the rename. systemd-tmpfiles applies these removals on the first boot
# of this image. The overlay ships the replacement message of the day under the
# current name, and the image's preset owns the current user units.
r /etc/motd.d/dux-atomic - - - -
r /etc/systemd/user/graphical-session-pre.target.wants/dux-atomic-desktop.service - - - -
r /etc/systemd/user/graphical-session-pre.target.wants/dux-atomic-dms-defaults.service - - - -
