# dms-greeter masks the portal service inside the greeter's user session.
# greetd runs the greeter as the greeter user, whose home is /var/lib/greeter.
# This rule owns the home as well, so a missing package rule cannot leave the
# parent directory owned by root.
d /var/lib/greeter 0755 greeter greeter -
L /var/lib/greeter/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
d /var/lib/greeter/.config 0755 greeter greeter -
d /var/lib/greeter/.config/systemd 0755 greeter greeter -
d /var/lib/greeter/.config/systemd/user 0755 greeter greeter -
