# xdg-desktop-portal-hyprland ships its own preferences in /usr/share, and
# xdg-desktop-portal reads /etc/xdg-desktop-portal first. This copy routes the
# compositor-owned portals to hyprland and adds FileChooser=gtk, because
# xdg-desktop-portal-gnome hands file pickers to nautilus from version 47.0 and
# this image ships no nautilus. Secret stays on gnome-keyring.
[preferred]
default=hyprland;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
